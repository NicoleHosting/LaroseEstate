services:
  - type: web
    name: the-larose-files
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: larose-files-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: larose-uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: larose-files-db
    plan: starter
    databaseName: larose_files
    user: larose

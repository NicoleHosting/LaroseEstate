services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: larose_files
      POSTGRES_USER: larose
      POSTGRES_PASSWORD: larose
    ports:
      - "5432:5432"
    volumes:
      - larose-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larose -d larose_files"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  larose-postgres:
